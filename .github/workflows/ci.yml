name: CI
on:
  pull_request:
    branches:
      - "*"
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
      SKIP_SERVER_CONTENT: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
        continue-on-error: false

      - name: Run unit & integration tests
        run: npm test -- --testPathIgnorePatterns="tests/integration/slack-webhook"
        continue-on-error: false

      - name: Run Slack webhook integration tests
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_SUCCESS: ${{ secrets.SLACK_WEBHOOK_URL_SUCCESS }}
        run: npx jest tests/integration/slack-webhook.test.ts --forceExit
        continue-on-error: false